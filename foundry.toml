[profile.default]
src = 'contracts/cronos/bridge'
test = 'test/foundry'
libs = ['node_modules']
out = 'artifacts-foundry'
cache_path = 'cache-foundry'
solc_version = '0.8.30'
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
remappings = ['@openzeppelin/=node_modules/@openzeppelin/']
[fuzz]
runs = 512
seed = '0x1234567890abcdef'
