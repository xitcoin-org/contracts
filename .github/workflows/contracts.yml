name: Contracts

on:
  pull_request:
    paths:
      - '.github/workflows/contracts.yml'
      - '.nvmrc'
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/contracts.yml'
      - '.nvmrc'
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile, test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Compile contracts
        run: npm run compile

      - name: Test all contracts
        run: npm test

      - name: Run blocking Slither analysis
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f
        with:
          target: '.'
          ignore-compile: true
          slither-version: '0.11.6'
          fail-on: medium
          slither-args: '--filter-paths "node_modules|contracts/test|contracts/cronos/v1|contracts/cronos/v2|contracts/cronos/v3"'
